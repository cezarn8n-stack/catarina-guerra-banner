<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Acompanhe Catarina Guerra nas redes sociais."
    />

    <meta name="theme-color" content="#075eb7" />

    <title>Catarina Guerra | Redes Sociais</title>

    <link rel="stylesheet" href="./style.css" />

    <script src="./script.js" defer></script>
  </head>

  <body>
    <main>
      <!-- PRIMEIRA ÁREA: BANNER -->
      <section
        class="hero"
        id="inicio"
        aria-label="Banner de Catarina Guerra"
      >
        <div class="hero__visual">
            <img
                class="hero__banner"
                src="./assets/banner_web.png"
                alt="Catarina Guerra, candidata a deputada estadual, número 44188."
                width="1024"
                height="1536"
                fetchpriority="high"
                decoding="async"
            />
        </div>

        <!--
          No celular, esta área fica abaixo da imagem.
          No computador, fica na lateral direita.
        -->
        <div class="hero__cta">
          <button
            class="scroll-indicator"
            id="scrollIndicator"
            type="button"
            aria-label="Conhecer as redes sociais de Catarina Guerra"
          >
            <span class="scroll-indicator__label">
              Conheça as redes
            </span>

            <svg
              class="scroll-indicator__icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M5 8.5L12 15.5L19 8.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </section>

      <!-- SEGUNDA ÁREA: REDES SOCIAIS -->
      <section
        class="social-section"
        id="redes"
        aria-labelledby="socialTitle"
      >
        <div class="social-shell">
          <p class="social-kicker">
            Conecte-se
          </p>

          <h1 class="social-title" id="socialTitle">
            Acompanhe Catarina de perto
          </h1>

          <p class="social-description">
            Escolha uma rede social e acompanhe ações, projetos,
            visitas e novidades em primeira mão.
          </p>

          <nav
            class="social-links"
            aria-label="Redes sociais de Catarina Guerra"
          >
            <!-- INSTAGRAM -->
            <a
              class="social-link social-link--instagram"
              href="https://www.instagram.com/catarinaguerrarr/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Abrir o Instagram de Catarina Guerra"
            >
              <span
                class="social-link__icon"
                aria-hidden="true"
              >
                <svg viewBox="0 0 24 24">
                  <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  />

                  <circle
                    cx="17.3"
                    cy="6.8"
                    r="1.1"
                    fill="currentColor"
                  />
                </svg>
              </span>

              <span class="social-link__content">
                <strong>Instagram</strong>
                <small>@catarinaguerrarr</small>
              </span>

              <svg
                class="social-link__arrow"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M7 17L17 7M9 7H17V15"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>

            <!-- FACEBOOK -->
            <a
              class="social-link social-link--facebook"
              href="https://www.facebook.com/search/top?q=catarina%20guerra"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Abrir o Facebook de Catarina Guerra"
            >
              <span
                class="social-link__icon"
                aria-hidden="true"
              >
                <svg viewBox="0 0 24 24">
                  <path
                    d="M14.4 8H17V4.2C16.3 4.1 14.9 4 13.3 4C10.1 4 7.9 6 7.9 9.7V13H4.5V17.2H7.9V24H12.1V17.2H15.7L16.3 13H12.1V10.1C12.1 8.9 12.4 8 14.4 8Z"
                    fill="currentColor"
                  />
                </svg>
              </span>

              <span class="social-link__content">
                <strong>Facebook</strong>
                <small>Catarina Guerra</small>
              </span>

              <svg
                class="social-link__arrow"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M7 17L17 7M9 7H17V15"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </nav>

          <button
            class="back-to-top"
            id="backToTop"
            type="button"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5 15.5L12 8.5L19 15.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <span>Voltar ao início</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
